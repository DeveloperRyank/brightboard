<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Brightboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="aurora a3"></div>
  <canvas id="particles"></canvas>

  <nav>
    <a class="brand mono" href="{{ url_for('index') }}" style="color: var(--text);">BRIGHT<span>·</span>BOARD</a>
    <div class="links">
      {% if student %}
        <a href="{{ url_for('onboarding') }}" class="who {{ 'active' if request.endpoint == 'onboarding' }}" title="Switch or add an account">👤 {{ student.name }}</a>
      {% endif %}
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Subjects</a>
      <a href="{{ url_for('upload') }}" class="{{ 'active' if request.endpoint == 'upload' }}">Upload</a>
      <a href="{{ url_for('analytics') }}" class="{{ 'active' if request.endpoint == 'analytics' }}">Analytics</a>
      {% if student %}
        <a href="{{ url_for('logout') }}" class="logout" title="Log out">Log out</a>
      {% endif %}
    </div>
  </nav>

  <main>
    {% if config_problems %}
      {% for problem in config_problems %}
        <div class="banner">⚠ {{ problem }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
