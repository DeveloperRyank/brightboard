{% extends "base.html" %}
{% block title %}Sign in · Brightboard{% endblock %}
{% block content %}
<div class="hero">
  <div class="eyebrow">Brightboard</div>
  <h1>Sign in</h1>
  <p>Your own account — your lessons, your papers, your progress. Nobody else's name appears here.</p>
</div>

{% if error %}<div class="banner">{{ error }}</div>{% endif %}

<form method="post" action="{{ url_for('sign_in') }}" class="create-card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="fld">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" class="field" value="{{ email }}"
           maxlength="254" autocomplete="username" spellcheck="false" required
           style="width:100%;">
  </div>
  <div class="fld">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" class="field"
           maxlength="1024" autocomplete="current-password" required style="width:100%;">
  </div>
  <div class="create-actions">
    <button class="btn gradient" type="submit">Sign in →</button>
    <a class="quiet-link" href="{{ url_for('sign_up') }}">Create an account</a>
  </div>
</form>
{% endblock %}
